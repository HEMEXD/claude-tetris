<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TETRIS MATEO</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button id="theme-toggle" type="button" role="switch" aria-checked="false">
      <span>Modo claro</span>
      <span class="switch-track"><span class="switch-thumb"></span></span>
    </button>

    <label class="skin-picker">
      <span>Skin</span>
      <select id="skin-select" aria-label="Skin del juego"></select>
    </label>

    <div class="wrapper">
      <h1 class="game-title">TETRIS MATEO</h1>
      <div class="stage">
        <div class="game-container">
          <canvas id="board" width="300" height="600"></canvas>

          <aside class="panel">
            <div class="panel-section">
              <span class="label">SCORE</span>
              <span class="value" id="score">0</span>
            </div>
            <div class="panel-section">
              <span class="label">LINES</span>
              <span class="value" id="lines">0</span>
            </div>
            <div class="panel-section">
              <span class="label">LEVEL</span>
              <span class="value" id="level">1</span>
            </div>

            <div class="panel-section">
              <span class="label">COMBO</span>
              <span class="combo-row">
                <span class="value" id="combo">–</span>
                <span class="badge" id="b2b" hidden>B2B</span>
              </span>
            </div>

            <div class="panel-section">
              <span class="label">POWER-UP</span>
              <span class="value" id="power">0/5</span>
            </div>

            <div class="panel-section">
              <span class="label">HOLD</span>
              <canvas id="hold-canvas" width="120" height="120"></canvas>
            </div>

            <div class="panel-section">
              <span class="label">NEXT</span>
              <canvas id="next-canvas" width="120" height="120"></canvas>
            </div>

            <div class="panel-section controls">
              <span class="label">CONTROLS</span>
              <ul>
                <li><kbd>←</kbd><kbd>→</kbd> mover</li>
                <li><kbd>↑</kbd> rotar</li>
                <li><kbd>↓</kbd> bajar</li>
                <li><kbd>Space</kbd> caída</li>
                <li><kbd>C</kbd><kbd>Shift</kbd> reservar</li>
                <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
                <li><kbd>M</kbd> sonido</li>
              </ul>
            </div>
          </aside>
        </div>

        <div id="overlay" class="overlay hidden">
          <div class="overlay-box">
            <p id="overlay-title">GAME OVER</p>
            <p id="overlay-score"></p>

            <div id="pause-menu" class="menu" hidden>
              <button id="resume-btn" class="menu-btn" type="button">Reanudar</button>
              <button id="pause-restart-btn" class="menu-btn" type="button">Reiniciar</button>
              <button id="controls-btn" class="menu-btn secondary" type="button">Ver controles</button>
              <label class="level-select">
                <span>Nivel inicial</span>
                <select id="start-level"></select>
              </label>
              <p class="menu-hint">Se aplica al reiniciar</p>
            </div>

            <div id="controls-panel" class="menu" hidden>
              <div id="controls-list" class="controls"></div>
              <button id="controls-back-btn" class="menu-btn secondary" type="button">Atrás</button>
            </div>

            <form id="name-form" class="name-form" hidden>
              <p id="new-record-msg"></p>
              <input id="name-input" type="text" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Tu nombre" aria-label="Tu nombre" />
              <button class="menu-btn" type="submit">Guardar</button>
            </form>

            <div id="records-panel" class="records" hidden>
              <ol id="records-list"></ol>
              <p id="records-best"></p>
            </div>

            <button id="start-btn" class="menu-btn" type="button" hidden>Jugar</button>
            <button id="restart-btn" type="button">Reiniciar</button>
            <button id="reset-records-btn" class="menu-btn secondary small" type="button" hidden>Resetear records</button>
          </div>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
